openapi: 3.0.3
info:
  title: SANAD Smart Home API
  description: API to discover, control, and manage smart home devices and rooms.
  version: 1.0.0

tags:
  - name: Smart Home
    description: Smart home discovery, device control, device management, and room management.

paths:
  /api/v1/smart-home/discover:
    get:
      tags:
        - Smart Home
      summary: Scan the network
      description: Runs UDP discovery, stores newly discovered devices, marks missing devices disconnected, and returns all devices.
      parameters:
        - in: query
          name: timeoutMs
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          description: Discovery timeout in milliseconds. Defaults to 4000; invalid values fall back to 400.
      responses:
        '200':
          description: Cached devices after discovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesMapResponse'

  /api/v1/smart-home/devices:
    get:
      tags:
        - Smart Home
      summary: Get all devices
      responses:
        '200':
          description: All devices keyed by device id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesMapResponse'
    post:
      tags:
        - Smart Home
      summary: Register a new device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    patch:
      tags:
        - Smart Home
      summary: Update existing device info
      description: Updates the stored name and forwards the name to the physical device API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceInfoRequest'
      responses:
        '200':
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

  /api/v1/smart-home/devices/control:
    post:
      tags:
        - Smart Home
      summary: Control a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRequest'
      responses:
        '200':
          description: Updated device, or false if the device is not cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDeviceResponse'

  /api/v1/smart-home/devices/{id}/info:
    get:
      tags:
        - Smart Home
      summary: Get live device info
      description: Fetches live info directly from the physical device over HTTP.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Physical device response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyResponse'

  /api/v1/smart-home/devices/{id}/room:
    patch:
      tags:
        - Smart Home
      summary: Change device room
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDeviceRoomRequest'
      responses:
        '200':
          description: TypeORM update result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResultResponse'

  /api/v1/smart-home/devices/{id}:
    get:
      tags:
        - Smart Home
      summary: Get a device by id
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device or null/undefined if not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
    delete:
      tags:
        - Smart Home
      summary: Delete a device
      description: Sends factory reset to the physical device, then deletes the DB record.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDeviceResponse'

  /api/v1/smart-home/rooms:
    get:
      tags:
        - Smart Home
      summary: Get all rooms
      responses:
        '200':
          description: All rooms keyed by room id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsMapResponse'
    post:
      tags:
        - Smart Home
      summary: Register a new room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRoomRequest'
      responses:
        '200':
          description: Registered room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    patch:
      tags:
        - Smart Home
      summary: Update existing room info
      description: Runtime expects the room id in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Updated room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'

  /api/v1/smart-home/rooms/{id}:
    get:
      tags:
        - Smart Home
      summary: Get a room by id
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room or null/undefined if not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
    delete:
      tags:
        - Smart Home
      summary: Delete a room by id
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRoomResponse'

  /api/v1/smart-home/rooms/{id}/navigate:
    get:
      tags:
        - Smart Home
      summary: Navigate robot to room
      description: Sends a Nav2 NavigateToPose goal using the room stored pose.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Navigation goal sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigateRoomResponse'
components:
  parameters:
    DeviceId:
      in: path
      name: id
      required: true
      schema:
        type: string
    RoomId:
      in: path
      name: id
      required: true
      schema:
        type: string

  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        control_type:
          type: string
        state:
          type: integer
        connected:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        room:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RoomRef'

    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        min_x:
          type: number
        max_x:
          type: number
        min_y:
          type: number
        max_y:
          type: number
        theta:
          type: number
        pose_x:
          type: number
        pose_y:
          type: number
        pose_theta:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        devices:
          type: array
          items:
            - $ref: '#/components/schemas/DeviceRef'

    RoomRef:
      type: object
      description: Room assigned to a device. Does not include the devices array to avoid circular responses.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        min_x:
          type: number
        max_x:
          type: number
        min_y:
          type: number
        max_y:
          type: number
        theta:
          type: number
        pose_x:
          type: number
        pose_y:
          type: number
        pose_theta:
          type: number

    DeviceRef:
      type: object
      description: Device inside a room. Does not include the room field to avoid circular responses.
      properties:
        id:
          type: string
        name:
          type: string
        control_type:
          type: string
        state:
          type: integer
        connected:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DevicesMap:
      type: object
      description: Object keyed by device id.
      additionalProperties:
        $ref: '#/components/schemas/Device'

    RoomsMap:
      type: object
      description: Object keyed by room id.
      additionalProperties:
        $ref: '#/components/schemas/Room'

    RegisterDeviceRequest:
      type: object
      required:
        - device
      properties:
        device:
          type: object
          required:
            - id
            - name
            - control_type
            - state
          properties:
            id:
              type: string
            name:
              type: string
            control_type:
              type: string
              example: binary
            state:
              type: number
        room:
          type: object
          description: Optional room lookup for associating the device on registration. At least one of id or name may be provided.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    UpdateDeviceInfoRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    ControlRequest:
      type: object
      required:
        - id
        - state
      properties:
        id:
          type: string
        state:
          type: number
          description: For binary control_type devices, must be 0 or 1.

    ChangeDeviceRoomRequest:
      type: object
      required:
        - roomId
      properties:
        roomId:
          type: string

    RegisterRoomRequest:
      type: object
      required:
        - id
        - name
        - min_x
        - max_x
        - min_y
        - max_y
        - theta
        - pose_x
        - pose_y
        - pose_theta
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        min_x:
          type: number
        max_x:
          type: number
        min_y:
          type: number
        max_y:
          type: number
        theta:
          type: number
        pose_x:
          type: number
        pose_y:
          type: number
        pose_theta:
          type: number

    UpdateRoomRequest:
      type: object
      description: Include the room id, then send only the fields you want to update. All room fields below are optional.
      required:
        - id
      properties:
        id:
          type: string
          description: Required room id to update.
        name:
          type: string
          description: Optional.
        min_x:
          type: number
          description: Optional.
        max_x:
          type: number
          description: Optional.
        min_y:
          type: number
          description: Optional.
        max_y:
          type: number
          description: Optional.
        theta:
          type: number
          description: Optional.
        pose_x:
          type: number
          description: Optional.
        pose_y:
          type: number
          description: Optional.
        pose_theta:
          type: number
          description: Optional.
